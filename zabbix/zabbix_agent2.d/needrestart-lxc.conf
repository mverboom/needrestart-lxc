# needrestart-lxc Zabbix integration (agent2 UserParameter)
# Reads the pre-generated JSON document; the scan itself runs via cron so the
# agent response stays well below the Zabbix server Timeout. If the scan has
# not run yet (no JSON file), return an empty document so the dependent items
# and discovery rule stay clean.
UserParameter=needrestart.lxc.master,cat /var/cache/needrestart-lxc/zabbix.json 2>/dev/null || echo '{"containers":[],"summary":{"needing_restart":0,"total_services":0,"cves":0,"state":0,"text":"No containers need a restart."}}'
