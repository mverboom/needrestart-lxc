# needrestart Zabbix integration (agent2 UserParameter)
#
# needrestart.master: needrestart's own batch output (services, kernel,
# microcode, sessions). Unchanged.
#
# needrestart.cve.master: the JSON produced on this host by needrestart-cve,
# which the cron job refreshes every 15 minutes. needrestart has no CVE data of
# its own, so the helper resolves each flagged service's stale libraries to
# dpkg packages and asks OSV/Ubuntu how many CVEs the pending update fixes.
# When the cache document does not exist yet the fallback is a summary with
# state 9 ("no data"), which raises the visible "Needrestart CVE analysis is not
# reporting" trigger - never a silent 0. A host that is powered off simply has
# no item value, so that trigger stays quiet for it.
UserParameter=needrestart.master,sudo /usr/sbin/needrestart -b 2> /dev/null
UserParameter=needrestart.cve.master,cat /var/cache/needrestart-cve/zabbix.json 2>/dev/null || echo '{"summary":{"services":0,"cves":0,"cves_ok":0,"max_cvss":"n/a","state":9,"text":"needrestart-cve has not produced a report yet"}}'
